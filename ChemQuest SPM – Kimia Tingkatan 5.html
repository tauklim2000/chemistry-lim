:root[data-theme="dark"]{--bg:#10161f;--card:#192230;--tx:#e8edf5;--mu:#9aa8bb;--ac:#3cc4bb;--ok:#4cc46b;--no:#ff7a6b;--bd:#2c3a4d}

<script>
// ===== DATA: soalan ikut bab/topik. a = indeks jawapan betul (0=A). Sumber: ChemQuest 2024 F5 K1 =====
const TOPICS=[
{id:"b1",bm:"Bab 1 Keseimbangan Redoks",en:"Chapter 1 Redox Equilibrium",subs:[
{id:"b1_1",bm:"1.1 Pengoksidaan dan penurunan",en:"1.1 Oxidation and reduction",qs:[
{s:"Pahang 2024 S13",q:["Apakah maksud pengoksidaan?","What is the meaning of oxidation?"],o:[["Hilang elektron","Loss of electron"],["Hilang oksigen","Loss of oxygen"],["Terima hidrogen","Gain of hydrogen"],["Pengurangan nombor pengoksidaan","Decrease in oxidation number"]],a:0,g:["Pengoksidaan = kehilangan elektron (OIL RIG), penambahan oksigen, kehilangan hidrogen, atau pertambahan nombor pengoksidaan.","Oxidation = loss of electrons (OIL RIG), gain of oxygen, loss of hydrogen, or increase in oxidation number."]},
{s:"Kelantan 2024 S14",q:["Antara berikut yang manakah merupakan tindak balas redoks?","Which of the following is a redox reaction?"],o:[["Zink oksida + karbon","Zinc oxide + carbon"],["Kuprum(II) oksida + asid nitrik","Copper(II) oxide + nitric acid"],["Kuprum(II) sulfat + larutan natrium hidroksida","Copper(II) sulphate + sodium hydroxide solution"],["Asid hidroklorik + larutan natrium hidroksida","Hydrochloric acid + sodium hydroxide solution"]],a:0,g:["ZnO + C → Zn + CO. Karbon mengambil oksigen (teroksida) dan zink oksida diturunkan. B, C dan D ialah peneutralan/pemendakan: nombor pengoksidaan tidak berubah.","ZnO + C → Zn + CO. Carbon gains oxygen (oxidised) and zinc oxide is reduced. B, C and D are neutralisation/precipitation: no change in oxidation number."]},
{s:"Putrajaya 2024 S11",q:["Antara yang berikut, yang manakah tindak balas redoks?","Which of the following is a redox reaction?"],o:[["Pendidihan","Boiling"],["Pengaratan","Rusting"],["Pemendakan","Precipitation"],["Peneutralan","Neutralisation"]],a:1,g:["Pengaratan: Fe → Fe²⁺ + 2e⁻ (pengoksidaan) dan O₂ diturunkan. Pendidihan ialah perubahan fizik; pemendakan dan peneutralan tidak mengubah nombor pengoksidaan.","Rusting: Fe → Fe²⁺ + 2e⁻ (oxidation) while O₂ is reduced. Boiling is a physical change; precipitation and neutralisation involve no change in oxidation number."]},
{s:"Selangor Set2 2024 S23",q:["Antara yang berikut, persamaan manakah mewakili satu tindak balas redoks?","Which of the following equations represents a redox reaction?"],o:[["2CuO + C → 2Cu + CO₂","2CuO + C → 2Cu + CO₂"],["H₂SO₄ + CuO → CuSO₄ + H₂O","H₂SO₄ + CuO → CuSO₄ + H₂O"],["Pb(NO₃)₂ + 2KI → PbI₂ + 2KNO₃","Pb(NO₃)₂ + 2KI → PbI₂ + 2KNO₃"],["2CH₃COOH + CaCO₃ → (CH₃COO)₂Ca + H₂O + CO₂","2CH₃COOH + CaCO₃ → (CH₃COO)₂Ca + H₂O + CO₂"]],a:0,g:["Dalam A, Cu(+2→0) diturunkan dan C(0→+4) dioksidakan. B ialah peneutralan, C pemendakan, D asid + karbonat: tiada perubahan nombor pengoksidaan.","In A, Cu (+2→0) is reduced and C (0→+4) is oxidised. B is neutralisation, C precipitation, D acid + carbonate: no change in oxidation number."]},
{s:"Johor 2024 S13",q:["Antara bahan berikut yang manakah merupakan agen pengoksidaan?","Which of the following substances is an oxidising agent?"],o:[["Air klorin","Chlorine water"],["Kalium iodida","Potassium iodide"],["Serbuk zink","Zinc powder"],["Ferum(II) sulfat","Iron(II) sulphate"]],a:0,g:["Agen pengoksidaan menerima elektron. Cl₂ mudah diturunkan kepada Cl⁻. Kalium iodida, zink dan ferum(II) ialah agen penurunan.","An oxidising agent accepts electrons. Cl₂ is easily reduced to Cl⁻. Potassium iodide, zinc and iron(II) are reducing agents."]},
{s:"Johor 2024 S14",q:["Apakah maksud agen penurunan?","What is the meaning of a reducing agent?"],o:[["Bahan yang mengoksidakan bahan lain tetapi ia sendiri diturunkan","Substance that oxidises other substances but is itself reduced"],["Bahan yang menurunkan bahan lain tetapi ia sendiri dioksidakan","Substance that reduces other substances but is itself oxidised"],["Bahan yang mengalami pengoksidaan","Substance that undergoes oxidation"],["Bahan yang mengalami penurunan","Substance that undergoes reduction"]],a:1,g:["Agen penurunan menderma elektron kepada bahan lain (menurunkannya) dan dirinya dioksidakan. Pilihan A ialah takrif agen pengoksidaan.","A reducing agent donates electrons to another substance (reducing it) and is itself oxidised. Option A is the definition of an oxidising agent."]},
{s:"Pahang 2024 S16",q:["Fe₂O₃ + 3CO → 2Fe + 3CO₂. Apakah perubahan nombor pengoksidaan bagi ferum?","Fe₂O₃ + 3CO → 2Fe + 3CO₂. What is the change in the oxidation number of iron?"],o:[["+3 → 0","+3 → 0"],["+2 → 0","+2 → 0"],["+3 → +2","+3 → +2"],["0 → +3","0 → +3"]],a:0,g:["Dalam Fe₂O₃, 2x + 3(−2) = 0 maka Fe = +3. Fe unsur = 0. Ferum diturunkan: +3 → 0.","In Fe₂O₃, 2x + 3(−2) = 0 so Fe = +3. Elemental Fe = 0. Iron is reduced: +3 → 0."]},
{s:"Johor Muar 2024 S9",q:["Berapakah nombor pengoksidaan kromium dalam K₂Cr₂O₇?","What is the oxidation number of chromium in K₂Cr₂O₇?"],o:[["+2","+2"],["+4","+4"],["+6","+6"],["+8","+8"]],a:2,g:["2(+1) + 2x + 7(−2) = 0 → 2x = +12 → x = +6.","2(+1) + 2x + 7(−2) = 0 → 2x = +12 → x = +6."]},
{s:"MRSM 2024 S17",q:["Apakah nombor pengoksidaan bagi oksigen dalam molekul ozon, O₃?","What is the oxidation number of oxygen in an ozone molecule, O₃?"],o:[["−6","−6"],["−2","−2"],["−1","−1"],["0","0"]],a:3,g:["Ozon ialah unsur (hanya atom oksigen), maka nombor pengoksidaan = 0.","Ozone is an element (only oxygen atoms), so its oxidation number = 0."]},
{s:"Putrajaya 2024 S22",q:["Apakah nombor pengoksidaan fluorin dalam gas fluorin, F₂?","What is the oxidation number of fluorine in fluorine gas, F₂?"],o:[["0","0"],["−1","−1"],["+1","+1"],["−2","−2"]],a:0,g:["Semua unsur dalam keadaan bebas (F₂, O₂, Cu…) mempunyai nombor pengoksidaan 0.","Every free element (F₂, O₂, Cu…) has an oxidation number of 0."]},
{s:"Selangor Set2 2024 S38",q:["Zn + 2H⁺ → Zn²⁺ + H₂. Apakah perubahan nombor pengoksidaan bagi hidrogen?","Zn + 2H⁺ → Zn²⁺ + H₂. What is the change in oxidation number for hydrogen?"],o:[["0 kepada +1","0 to +1"],["0 kepada +2","0 to +2"],["+1 kepada 0","+1 to 0"],["+1 kepada +2","+1 to +2"]],a:2,g:["H⁺ (+1) menerima elektron menjadi H₂ (0). Hidrogen diturunkan: +1 → 0.","H⁺ (+1) gains electrons to form H₂ (0). Hydrogen is reduced: +1 → 0."]},
{s:"SPM 2023 S20",q:["Berdasarkan siri keupayaan elektrod piawai (Ag⁺/Ag +0.80 V, Cu²⁺/Cu +0.34 V, Pb²⁺/Pb −0.13 V, Zn²⁺/Zn −0.76 V), bahan tindak balas manakah akan mengalami tindak balas penyesaran?","Based on the standard electrode potentials (Ag⁺/Ag +0.80 V, Cu²⁺/Cu +0.34 V, Pb²⁺/Pb −0.13 V, Zn²⁺/Zn −0.76 V), which reactants will undergo a displacement reaction?"],o:[["Larutan argentum nitrat dan zink","Silver nitrate solution and zinc"],["Larutan zink sulfat dan plumbum","Zinc sulphate solution and lead"],["Larutan plumbum(II) nitrat dan kuprum","Lead(II) nitrate solution and copper"],["Larutan kuprum(II) sulfat dan argentum","Copper(II) sulphate solution and silver"]],a:0,g:["Logam yang lebih negatif (Zn) menyesarkan ion logam yang lebih positif (Ag⁺). Dalam B, C dan D logam yang ditambah kurang elektropositif daripada ion, maka tiada tindak balas.","A more negative metal (Zn) displaces the ion of a more positive metal (Ag⁺). In B, C and D the metal added is less electropositive than the ion, so no reaction occurs."]},
{s:"Negeri Sembilan 2024 S21",q:["L²⁺ + 2e⁻ ⇌ L, E° = −1.20 V; M³⁺ + 3e⁻ ⇌ M, E° = −2.08 V. Antara yang berikut, agen penurunan yang manakah paling kuat?","L²⁺ + 2e⁻ ⇌ L, E° = −1.20 V; M³⁺ + 3e⁻ ⇌ M, E° = −2.08 V. Which is the strongest reducing agent?"],o:[["L²⁺","L²⁺"],["M³⁺","M³⁺"],["L","L"],["M","M"]],a:3,g:["Nilai E° paling negatif (−2.08 V) bermaksud logam M paling mudah menderma elektron, maka M ialah agen penurunan paling kuat.","The most negative E° (−2.08 V) means metal M donates electrons most easily, so M is the strongest reducing agent."]},
{s:"Melaka 2024 S7",q:["0.05 mol kuprum(II) oksida, CuO bertindak balas dengan gas hidrogen membentuk pepejal perang, Y. Berapakah jisim Y? [Cu = 64, O = 16]","0.05 mol of copper(II) oxide, CuO reacts with hydrogen gas to form a brown solid, Y. What is the mass of Y? [Cu = 64, O = 16]"],o:[["0.8 g","0.8 g"],["2.4 g","2.4 g"],["3.2 g","3.2 g"],["4.0 g","4.0 g"]],a:2,g:["CuO + H₂ → Cu + H₂O. 1 mol CuO → 1 mol Cu, maka 0.05 mol Cu. Jisim = 0.05 × 64 = 3.2 g.","CuO + H₂ → Cu + H₂O. 1 mol CuO → 1 mol Cu, so 0.05 mol Cu. Mass = 0.05 × 64 = 3.2 g."]},
{s:"MRSM 2024 S19",q:["X₂ + 2KBr → 2KX + Br₂. X ialah unsur Kumpulan 17. Apakah pemerhatian jangkaan apabila X digantikan dengan iodin?","X₂ + 2KBr → 2KX + Br₂. X is a Group 17 element. What is the expected observation when X is replaced by iodine?"],o:[["Gas perang terhasil","Brown gas is produced"],["Warna perang larutan kekal","Brown solution remains"],["Larutan tanpa warna kekal","Colourless solution remains"],["Warna perang larutan dinyahwarnakan","Brown solution decolourised"]],a:1,g:["X₂ boleh menyesarkan bromin, maka X lebih reaktif daripada Br. Iodin kurang reaktif daripada bromin, jadi tiada penyesaran dan larutan kekal perang.","X₂ displaces bromine, so X is more reactive than Br. Iodine is less reactive than bromine, so no displacement occurs and the brown solution remains."]},
{s:"Kelantan 2024 S19",q:["Tindak balas I: I₂O₅ + 5CO → 5CO₂ + I₂. Tindak balas II: SO₂ + 2H₂S → 3S + 2H₂O. Apakah agen penurunan bagi setiap tindak balas?","Reaction I: I₂O₅ + 5CO → 5CO₂ + I₂. Reaction II: SO₂ + 2H₂S → 3S + 2H₂O. What is the reducing agent for each reaction?"],o:[["I: I₂O₅, II: SO₂","I: I₂O₅, II: SO₂"],["I: I₂O₅, II: H₂S","I: I₂O₅, II: H₂S"],["I: CO, II: H₂S","I: CO, II: H₂S"],["I: CO, II: SO₂","I: CO, II: SO₂"]],a:2,g:["Agen penurunan dioksidakan. I: C dalam CO (+2 → +4). II: S dalam H₂S (−2 → 0). I₂O₅ dan SO₂ diturunkan.","The reducing agent is oxidised. I: C in CO (+2 → +4). II: S in H₂S (−2 → 0). I₂O₅ and SO₂ are reduced."]},
{s:"Sarawak Set01 2024 S20",q:["I₂ + SO₂ + 2H₂O → 2I⁻ + SO₄²⁻ + 4H⁺. Namakan agen pengoksidaan dalam tindak balas ini.","I₂ + SO₂ + 2H₂O → 2I⁻ + SO₄²⁻ + 4H⁺. Name the oxidising agent in this reaction."],o:[["Sulfur dioksida","Sulphur dioxide"],["Ion sulfat","Sulphate ion"],["Iodin","Iodine"],["Air","Water"]],a:2,g:["Iodin diturunkan (0 → −1) sambil mengoksidakan SO₂ (+4 → +6). Bahan yang diturunkan ialah agen pengoksidaan.","Iodine is reduced (0 → −1) while oxidising SO₂ (+4 → +6). The substance that is reduced is the oxidising agent."]},
{s:"Melaka 2024 S10",q:["3Mg + Fe₂O₃ → 3MgO + 2Fe. Berapakah jisim ferum yang terhasil daripada 16.0 g ferum(III) oksida? [Fe = 56, Mg = 24, O = 16]","3Mg + Fe₂O₃ → 3MgO + 2Fe. What is the mass of iron produced from 16.0 g of iron(III) oxide? [Fe = 56, Mg = 24, O = 16]"],o:[["4.8 g","4.8 g"],["5.6 g","5.6 g"],["11.2 g","11.2 g"],["112.0 g","112.0 g"]],a:2,g:["Jisim molar Fe₂O₃ = 160. Mol = 16/160 = 0.1. Nisbah Fe₂O₃ : Fe = 1 : 2, maka 0.2 mol Fe. Jisim = 0.2 × 56 = 11.2 g.","Molar mass of Fe₂O₃ = 160. Moles = 16/160 = 0.1. Ratio Fe₂O₃ : Fe = 1 : 2, so 0.2 mol Fe. Mass = 0.2 × 56 = 11.2 g."]},
{s:"Sarawak Set01 2024 S8",q:["Antara persamaan kimia berikut, yang manakah menunjukkan kuprum telah diturunkan?","Which chemical equation shows that copper is reduced?"],o:[["Cu + 2AgNO₃ → Cu(NO₃)₂ + 2Ag","Cu + 2AgNO₃ → Cu(NO₃)₂ + 2Ag"],["2Cu + O₂ → 2CuO","2Cu + O₂ → 2CuO"],["CuSO₄ + Ba(NO₃)₂ → Cu(NO₃)₂ + BaSO₄","CuSO₄ + Ba(NO₃)₂ → Cu(NO₃)₂ + BaSO₄"],["CuO + H₂ → Cu + H₂O","CuO + H₂ → Cu + H₂O"]],a:3,g:["Dalam D, CuO kehilangan oksigen dan Cu(+2) menjadi Cu(0): kuprum diturunkan. Dalam A dan B kuprum dioksidakan; C ialah pemendakan.","In D, CuO loses oxygen and Cu(+2) becomes Cu(0): copper is reduced. In A and B copper is oxidised; C is precipitation."]},
{s:"Kelantan 2024 S30",q:["Kuprum dimasukkan ke dalam larutan X nitrat: larutan menjadi biru dan pepejal termendap. Pernyataan manakah paling baik menerangkan pemerhatian ini?","Copper is placed in X nitrate solution: the solution turns blue and a solid is deposited. Which statement best describes the observation?"],o:[["Kuprum mengalami pengoksidaan","Copper undergoes oxidation"],["Kepekatan ion X semakin meningkat","Concentration of ion X increases"],["Ion X menerima elektron","Ion X gains electrons"],["Atom kuprum terbentuk","Copper atoms are formed"]],a:2,g:["Enapan pepejal ialah logam X yang terbentuk apabila ion X⁺ menerima elektron (diturunkan). Kepekatan ion X berkurang, bukan meningkat.","The solid deposited is metal X, formed when X⁺ ions gain electrons (are reduced). The concentration of X ions decreases, not increases."]},
{s:"Johor Muar 2024 S21",q:["Kepingan kuprum dimasukkan ke dalam larutan argentum nitrat. Apakah pemerhatian bagi tindak balas ini?","A copper plate is placed in silver nitrate solution. What is the observation?"],o:[["Gas tidak berwarna terbebas","Colourless gas is released"],["Pepejal perang terbentuk","Brown solid is formed"],["Kuprum semakin menipis","Copper becomes thinner"],["Keamatan warna biru larutan berkurang","Intensity of the blue colour of the solution decreases"]],a:2,g:["Cu menyesarkan Ag: Cu → Cu²⁺ + 2e⁻ maka kuprum menipis, dan larutan menjadi biru (keamatan bertambah). Argentum yang terenap berwarna kelabu, bukan perang.","Cu displaces Ag: Cu → Cu²⁺ + 2e⁻ so the copper becomes thinner and the solution turns blue (intensity increases). The silver deposited is grey, not brown."]},
{s:"Johor Pasir Gudang Set01 2024 S40",q:["Dawai kuprum dimasukkan ke dalam larutan magnesium nitrat dan tiada perubahan berlaku. Diberi Mg²⁺/Mg E° = −2.38 V dan Cu²⁺/Cu E° = +0.34 V. Pernyataan manakah menerangkan sebabnya?","A copper wire is placed in magnesium nitrate solution and no change occurs. Given Mg²⁺/Mg E° = −2.38 V and Cu²⁺/Cu E° = +0.34 V. Which statement explains why?"],o:[["Kuprum mudah melepaskan elektron membentuk ion kuprum(II)","Copper easily releases electrons to form copper(II) ions"],["Kuprum mempunyai nilai E° lebih negatif daripada magnesium","Copper has a more negative E° than magnesium"],["Magnesium ialah agen penurunan yang lebih kuat","Magnesium is a stronger reducing agent"],["Magnesium ialah agen pengoksidaan yang lemah","Magnesium is a weak oxidising agent"]],a:2,g:["Mg (E° −2.38 V) lebih mudah menderma elektron daripada Cu, jadi Mg ialah agen penurunan lebih kuat. Kuprum tidak dapat menurunkan ion Mg²⁺, maka tiada tindak balas.","Mg (E° −2.38 V) donates electrons more easily than Cu, so Mg is the stronger reducing agent. Copper cannot reduce Mg²⁺ ions, so there is no reaction."]},
{s:"MRSM 2024 S36",q:["Hidrogen peroksida berasid ditambah kepada larutan kalium iodida. Diberi I₂ + 2e⁻ ⇌ 2I⁻, E° = +0.54 V; H₂O₂ + 2H⁺ + 2e⁻ ⇌ 2H₂O, E° = +1.77 V. Pernyataan manakah betul?","Acidified hydrogen peroxide is added to potassium iodide solution. Given I₂ + 2e⁻ ⇌ 2I⁻, E° = +0.54 V; H₂O₂ + 2H⁺ + 2e⁻ ⇌ 2H₂O, E° = +1.77 V. Which statement is correct?"],o:[["Ion iodida diturunkan menjadi molekul iodin","Iodide ion is reduced to iodine molecule"],["Nombor pengoksidaan oksigen berkurang daripada −1 kepada −2","Oxidation number of oxygen decreases from −1 to −2"],["Hidrogen peroksida ialah agen penurunan","Hydrogen peroxide is a reducing agent"],["Warna larutan berubah daripada perang kepada tanpa warna","Colour of the solution changes from brown to colourless"]],a:1,g:["E° H₂O₂ lebih positif, maka H₂O₂ diturunkan (O: −1 → −2) dan ialah agen pengoksidaan. I⁻ dioksidakan menjadi I₂, jadi warna berubah daripada tanpa warna kepada perang.","H₂O₂ has the more positive E°, so H₂O₂ is reduced (O: −1 → −2) and is the oxidising agent. I⁻ is oxidised to I₂, so the colour changes from colourless to brown."]},
{s:"Kedah 2024 S22",q:["X₂ + 2NaY → Y₂ + 2NaX menunjukkan penyesaran halogen Y daripada larutan halidanya. Apakah halogen X dan Y?","X₂ + 2NaY → Y₂ + 2NaX shows displacement of halogen Y from its halide solution. What are halogens X and Y?"],o:[["X: iodin, Y: bromin","X: iodine, Y: bromine"],["X: bromin, Y: iodin","X: bromine, Y: iodine"],["X: iodin, Y: klorin","X: iodine, Y: chlorine"],["X: bromin, Y: klorin","X: bromine, Y: chlorine"]],a:1,g:["Halogen yang lebih reaktif menyesarkan halogen yang kurang reaktif daripada halidanya. Kereaktifan Cl > Br > I. Br₂ boleh menyesarkan I⁻, tetapi I₂ tidak boleh menyesarkan Br⁻ atau Cl⁻, dan Br₂ tidak boleh menyesarkan Cl⁻.","A more reactive halogen displaces a less reactive halogen from its halide. Reactivity is Cl > Br > I. Br₂ can displace I⁻, but I₂ cannot displace Br⁻ or Cl⁻, and Br₂ cannot displace Cl⁻."]},
{s:"SBP 2024 S11",q:["Larutan kalium bromida tanpa warna menjadi perang apabila bahan X ditambah. Apakah X?","Colourless potassium bromide solution turns brown when substance X is added. What is X?"],o:[["Kalium manganat(VII) berasid","Acidified potassium manganate(VII)"],["Ferum(II) sulfat","Iron(II) sulphate"],["Magnesium","Magnesium"],["Air iodin","Iodine water"]],a:0,g:["Warna perang ialah bromin, Br₂, terhasil apabila Br⁻ dioksidakan. Hanya agen pengoksidaan kuat seperti kalium manganat(VII) berasid dapat melakukannya. Ferum(II) dan magnesium ialah agen penurunan; iodin terlalu lemah untuk mengoksidakan Br⁻.","The brown colour is bromine, Br₂, formed when Br⁻ is oxidised. Only a strong oxidising agent such as acidified potassium manganate(VII) can do this. Iron(II) and magnesium are reducing agents; iodine is too weak to oxidise Br⁻."]},
{s:"Perlis 2024 S24",q:["Setengah persamaan pengoksidaan: 2I⁻ → I₂ + 2e⁻. Berdasarkan persamaan ini, pernyataan manakah benar?","Oxidation half-equation: 2I⁻ → I₂ + 2e⁻. Based on this equation, which statement is true?"],o:[["Elektron didermakan oleh iodin","Electrons are donated by iodine"],["Elektron diterima oleh iodin","Electrons are accepted by iodine"],["Elektron didermakan oleh ion iodida","Electrons are donated by iodide ions"],["Elektron diterima oleh ion iodida","Electrons are accepted by iodide ions"]],a:2,g:["Elektron berada di sebelah kanan persamaan, bermakna ion iodida kehilangan (mendermakan) elektron. Itulah pengoksidaan; ion iodida ialah agen penurunan.","The electrons are on the right side of the equation, meaning iodide ions lose (donate) electrons. That is oxidation; iodide ions are the reducing agent."]},
{s:"JUJ Set01 2024 S9",q:["Antara bahan berikut, yang manakah dapat menyesarkan bromin daripada kalium bromida?","Which of the following can displace bromine from potassium bromide?"],o:[["Air klorin","Chlorine water"],["Larutan iodin","Iodine solution"],["Hidrogen sulfida","Hydrogen sulphide"],["Larutan kalium manganat(VII) berasid","Acidified potassium manganate(VII) solution"]],a:0,g:["Penyesaran halogen: halogen yang lebih reaktif menyesarkan yang kurang reaktif. Klorin lebih reaktif daripada bromin: Cl₂ + 2KBr → 2KCl + Br₂. Iodin kurang reaktif daripada bromin.","Halogen displacement: a more reactive halogen displaces a less reactive one. Chlorine is more reactive than bromine: Cl₂ + 2KBr → 2KCl + Br₂. Iodine is less reactive than bromine."]},
{s:"Johor Pasir Gudang Set01 2024 S18",q:["Pemindahan elektron pada suatu jarak: larutan kalium manganat(VII) berasid dan larutan ferum(II) sulfat dihubungkan oleh asid sulfurik cair dan elektrod karbon. Ion yang manakah mengalami pengoksidaan?","Electron transfer at a distance: acidified potassium manganate(VII) solution and iron(II) sulphate solution connected by dilute sulphuric acid and carbon electrodes. Which ion undergoes oxidation?"],o:[["K⁺","K⁺"],["Fe²⁺","Fe²⁺"],["SO₄²⁻","SO₄²⁻"],["MnO₄⁻","MnO₄⁻"]],a:1,g:["MnO₄⁻ ialah agen pengoksidaan kuat (diturunkan kepada Mn²⁺). Ia mengoksidakan Fe²⁺ menjadi Fe³⁺ (+2 → +3). K⁺ dan SO₄²⁻ ialah ion penonton.","MnO₄⁻ is a strong oxidising agent (reduced to Mn²⁺). It oxidises Fe²⁺ to Fe³⁺ (+2 → +3). K⁺ and SO₄²⁻ are spectator ions."]},
{s:"Pahang 2024 S15",q:["Pemindahan elektron pada suatu jarak: elektrod X dalam larutan kalium iodida dan elektrod Y dalam air bromin. Antara berikut, yang manakah berlaku di X dan Y?","Electron transfer at a distance: electrode X in potassium iodide solution and electrode Y in bromine water. Which occurs at X and Y?"],o:[["Jisim X bertambah; jisim Y berkurang","Mass of X increases; mass of Y decreases"],["Ion iodida dioksidakan di X; bromin diturunkan di Y","Iodide ion is oxidised at X; bromine is reduced at Y"],["Larutan perang menjadi tanpa warna di X; tiada perubahan warna di Y","Brown solution turns colourless at X; no colour change at Y"],["Nombor pengoksidaan iodin berubah 0 → +2; bromin −1 → 0","Oxidation number of iodine changes 0 → +2; bromine −1 → 0"]],a:1,g:["Br₂ lebih kuat sebagai agen pengoksidaan daripada I₂, jadi Br₂ diturunkan kepada Br⁻ (Y) dan I⁻ dioksidakan kepada I₂ (X, larutan menjadi perang). Elektrod karbon tidak berubah jisimnya.","Br₂ is a stronger oxidising agent than I₂, so Br₂ is reduced to Br⁻ (Y) and I⁻ is oxidised to I₂ (X, solution turns brown). Carbon electrodes do not change in mass."]},
{s:"Negeri Sembilan 2024 S40",q:["Pemindahan elektron pada suatu jarak. Selepas 30 minit: larutan R bertukar daripada perang kepada tidak berwarna dan jarum galvanometer terpesong. Apakah Q dan R?","Electron transfer at a distance. After 30 minutes: solution R turns from brown to colourless and the galvanometer needle deflects. What are Q and R?"],o:[["Q: kalium iodida; R: air klorin","Q: potassium iodide; R: chlorine water"],["Q: kalium iodida; R: air bromin","Q: potassium iodide; R: bromine water"],["Q: kalium bromida; R: air bromin","Q: potassium bromide; R: bromine water"],["Q: kalium bromida; R: air iodin","Q: potassium bromide; R: iodine water"]],a:1,g:["R berubah daripada perang kepada tanpa warna: Br₂ diturunkan kepada Br⁻ (agen pengoksidaan). Q mesti agen penurunan yang dapat dioksidakan oleh bromin, iaitu kalium iodida (I⁻ → I₂). Air klorin tidak perang, dan Br⁻ tidak dapat dioksidakan oleh Br₂ atau I₂.","R changes from brown to colourless: Br₂ is reduced to Br⁻ (oxidising agent). Q must be a reducing agent that bromine can oxidise, i.e. potassium iodide (I⁻ → I₂). Chlorine water is not brown, and Br⁻ cannot be oxidised by Br₂ or I₂."]},
{s:"Melaka 2024 S20",q:["Pemindahan elektron pada suatu jarak: elektrod karbon X dalam larutan ferum(II) sulfat dan elektrod karbon Y dalam air bromin, dihubungkan asid sulfurik. Antara berikut, yang manakah betul?","Electron transfer at a distance: carbon electrode X in iron(II) sulphate solution and carbon electrode Y in bromine water, connected by sulphuric acid. Which is correct?"],o:[["Elektron mengalir melalui wayar dari elektrod Y ke X","Electrons flow through the wire from electrode Y to X"],["Warna perang kepada hijau di elektrod X","Brown to green colour at electrode X"],["Ferum terenap di elektrod X","Iron is deposited at electrode X"],["Ion Fe²⁺ membebaskan elektron membentuk ion Fe³⁺","Fe²⁺ ions release electrons to form Fe³⁺ ions"]],a:3,g:["Br₂ mengoksidakan Fe²⁺: Fe²⁺ → Fe³⁺ + e⁻ di X. Elektron mengalir dari X ke Y (bukan Y ke X). Di X warna berubah daripada hijau kepada perang, dan tiada logam ferum terenap.","Br₂ oxidises Fe²⁺: Fe²⁺ → Fe³⁺ + e⁻ at X. Electrons flow from X to Y (not Y to X). At X the colour changes from green to brown, and no iron metal is deposited."]},
{s:"Sarawak Set01 2024 S19",q:["Pemindahan elektron pada suatu jarak dalam tiub-U: air bromin dan larutan ferum(II) sulfat dipisahkan oleh X. Apakah fungsi X?","Electron transfer at a distance in a U-tube: bromine water and iron(II) sulphate solution separated by X. What is the function of X?"],o:[["Membenarkan pemindahan elektron dari terminal negatif ke terminal positif","Allows transfer of electrons from the negative terminal to the positive terminal"],["Membenarkan pengaliran ion dari kedua-dua larutan","Allows the flow of ions from both solutions"],["Menerima elektron daripada air bromin","Accepts electrons from bromine water"],["Bertindak sebagai agen pengoksidaan","Acts as an oxidising agent"]],a:1,g:["X (asid sulfurik / titian garam) melengkapkan litar dengan membenarkan ion bergerak antara dua larutan. Elektron hanya mengalir melalui wayar luar.","X (sulphuric acid / salt bridge) completes the circuit by letting ions move between the two solutions. Electrons only flow through the external wire."]},
{s:"SBP 2024 S22",q:["Pemindahan elektron pada suatu jarak: karbon X dalam larutan ferum(II) klorida dan karbon Y dalam larutan kalium dikromat(VI) berasid, dihubungkan asid sulfurik cair. Apakah pemerhatian pada karbon X dan Y?","Electron transfer at a distance: carbon X in iron(II) chloride solution and carbon Y in acidified potassium dichromate(VI) solution, connected by dilute sulphuric acid. What are the observations at carbon X and Y?"],o:[["X: hijau kepada perang; Y: ungu kepada tanpa warna","X: green to brown; Y: purple to colourless"],["X: hijau kepada perang; Y: jingga kepada hijau","X: green to brown; Y: orange to green"],["X: hijau kepada tanpa warna; Y: ungu kepada tanpa warna","X: green to colourless; Y: purple to colourless"],["X: perang kepada hijau; Y: jingga kepada hijau","X: brown to green; Y: orange to green"]],a:1,g:["Di X, Fe²⁺ (hijau) dioksidakan kepada Fe³⁺ (perang). Di Y, Cr₂O₇²⁻ (jingga) diturunkan kepada Cr³⁺ (hijau). Warna ungu ialah ciri MnO₄⁻, bukan dikromat.","At X, Fe²⁺ (green) is oxidised to Fe³⁺ (brown). At Y, Cr₂O₇²⁻ (orange) is reduced to Cr³⁺ (green). Purple is the colour of MnO₄⁻, not dichromate."]},
{s:"Johor Batu Pahat 2024 S18",q:["Persamaan ion X + Y²⁺ → X²⁺ + Y mewakili satu tindak balas kimia. Antara berikut, yang manakah betul tentang bahan-bahan itu?","The ionic equation X + Y²⁺ → X²⁺ + Y represents a chemical reaction. Which is correct about the substances?"],o:[["Dioksidakan: Y²⁺; diturunkan: X; agen pengoksidaan: X; agen penurunan: Y²⁺","Oxidised: Y²⁺; reduced: X; oxidising agent: X; reducing agent: Y²⁺"],["Dioksidakan: X; diturunkan: Y²⁺; agen pengoksidaan: X; agen penurunan: Y²⁺","Oxidised: X; reduced: Y²⁺; oxidising agent: X; reducing agent: Y²⁺"],["Dioksidakan: X²⁺; diturunkan: Y; agen pengoksidaan: Y; agen penurunan: X²⁺","Oxidised: X²⁺; reduced: Y; oxidising agent: Y; reducing agent: X²⁺"],["Dioksidakan: X; diturunkan: Y²⁺; agen pengoksidaan: Y²⁺; agen penurunan: X","Oxidised: X; reduced: Y²⁺; oxidising agent: Y²⁺; reducing agent: X"]],a:3,g:["X → X²⁺: X kehilangan elektron (dioksidakan) maka X ialah agen penurunan. Y²⁺ → Y: Y²⁺ menerima elektron (diturunkan) maka Y²⁺ ialah agen pengoksidaan. Bahan yang dioksidakan = agen penurunan; bahan yang diturunkan = agen pengoksidaan.","X → X²⁺: X loses electrons (oxidised) so X is the reducing agent. Y²⁺ → Y: Y²⁺ gains electrons (reduced) so Y²⁺ is the oxidising agent. The substance oxidised = reducing agent; the substance reduced = oxidising agent."]},
{s:"Terengganu 2024 S14",q:["Ion Fe³⁺ dalam larutan boleh ditukarkan kepada ion Fe²⁺ dengan menambah serbuk zink. Antara berikut, yang manakah dapat menggantikan serbuk zink dalam tindak balas ini?","Fe³⁺ ions in solution can be converted to Fe²⁺ ions by adding zinc powder. Which of the following can replace zinc powder in this reaction?"],o:[["Air bromin","Bromine water"],["Larutan kalium iodida","Potassium iodide solution"],["Larutan kalium heksasianoferat(II)","Potassium hexacyanoferrate(II) solution"],["Larutan kalium manganat(VII) berasid","Acidified potassium manganate(VII) solution"]],a:1,g:["Fe³⁺ → Fe²⁺ ialah penurunan, jadi perlukan agen penurunan. Ion iodida dioksidakan menjadi iodin (2I⁻ → I₂ + 2e⁻) dan menurunkan Fe³⁺. Air bromin dan kalium manganat(VII) berasid ialah agen pengoksidaan.","Fe³⁺ → Fe²⁺ is reduction, so a reducing agent is needed. Iodide ions are oxidised to iodine (2I⁻ → I₂ + 2e⁻) and reduce Fe³⁺. Bromine water and acidified potassium manganate(VII) are oxidising agents."]},
{s:"Sarawak Set02 2024 S35",q:["Siri tindak balas: I: N₂ + O₂ → 2NO; II: 2NO + O₂ → 2NO₂; III: 2NO₂ + 2H₂O + O₂ → 4HNO₃. Manakah perubahan nombor pengoksidaan nitrogen dalam setiap tindak balas dipadankan dengan tepat?","Series of reactions: I: N₂ + O₂ → 2NO; II: 2NO + O₂ → 2NO₂; III: 2NO₂ + 2H₂O + O₂ → 4HNO₃. Which changes in the oxidation number of nitrogen in each reaction are correctly matched?"],o:[["I: 0 → +2; II: 0 → +2; III: +2 → +5","I: 0 → +2; II: 0 → +2; III: +2 → +5"],["I: 0 → +2; II: +2 → +4; III: +4 → +5","I: 0 → +2; II: +2 → +4; III: +4 → +5"],["I: +2 → 0; II: 0 → +2; III: +2 → +4","I: +2 → 0; II: 0 → +2; III: +2 → +4"],["I: +2 → 0; II: +2 → +4; III: +4 → +2","I: +2 → 0; II: +2 → +4; III: +4 → +2"]],a:1,g:["I: N₂ (0) → NO (+2). II: NO (+2) → NO₂ (+4). III: NO₂ (+4) → HNO₃ (+5). Nitrogen dioksidakan pada setiap langkah.","I: N₂ (0) → NO (+2). II: NO (+2) → NO₂ (+4). III: NO₂ (+4) → HNO₃ (+5). Nitrogen is oxidised at every step."]},
{s:"JUJ Set01 2024 S34",q:["Mg + 2AgNO₃ → Mg(NO₃)₂ + 2Ag. Berapakah jisim argentum yang terhasil jika 50 cm³ larutan AgNO₃ 0.1 mol dm⁻³ digunakan? [Ag = 108]","Mg + 2AgNO₃ → Mg(NO₃)₂ + 2Ag. What is the mass of silver produced if 50 cm³ of 0.1 mol dm⁻³ AgNO₃ is used? [Ag = 108]"],o:[["0.64 g","0.64 g"],["0.32 g","0.32 g"],["0.54 g","0.54 g"],["0.16 g","0.16 g"]],a:2,g:["Mol AgNO₃ = 0.1 × 50/1000 = 0.005 mol. Nisbah AgNO₃ : Ag = 2 : 2 = 1 : 1, maka 0.005 mol Ag. Jisim = 0.005 × 108 = 0.54 g.","Moles of AgNO₃ = 0.1 × 50/1000 = 0.005 mol. Ratio AgNO₃ : Ag = 2 : 2 = 1 : 1, so 0.005 mol Ag. Mass = 0.005 × 108 = 0.54 g."]},
{s:"JUJ Set02 2024 S32",q:["Tindak balas I: logam X ditambah kepada ferum(III) sulfat (perang) menghasilkan larutan hijau. Tindak balas II: larutan hijau + bahan Y menghasilkan ferum (penyesaran). Tindak balas III: larutan hijau + bahan Z menukarkan semula kepada ferum(III) sulfat (perang). Apakah logam X, bahan Y dan bahan Z?","Reaction I: metal X added to iron(III) sulphate (brown) gives a green solution. Reaction II: green solution + substance Y gives iron (displacement). Reaction III: green solution + substance Z turns it back to iron(III) sulphate (brown). What are metal X, substance Y and substance Z?"],o:[["X: kuprum; Y: air bromin; Z: zink","X: copper; Y: bromine water; Z: zinc"],["X: magnesium; Y: zink; Z: air bromin","X: magnesium; Y: zinc; Z: bromine water"],["X: zink; Y: kuprum; Z: air bromin","X: zinc; Y: copper; Z: bromine water"],["X: magnesium; Y: air bromin; Z: kuprum","X: magnesium; Y: bromine water; Z: copper"]],a:1,g:["I: Fe³⁺ → Fe²⁺ (penurunan), perlukan logam reaktif seperti magnesium. II: Fe²⁺ → Fe (penyesaran), perlukan logam lebih reaktif daripada ferum, seperti zink. III: Fe²⁺ → Fe³⁺ (pengoksidaan), perlukan agen pengoksidaan seperti air bromin.","I: Fe³⁺ → Fe²⁺ (reduction) needs a reactive metal such as magnesium. II: Fe²⁺ → Fe (displacement) needs a metal more reactive than iron, such as zinc. III: Fe²⁺ → Fe³⁺ (oxidation) needs an oxidising agent such as bromine water."]},
{s:"Kelantan 2024 S20",q:["Formula kimia yang manakah dinamakan dengan betul berdasarkan sistem penamaan IUPAC?","Which chemical formula is correctly named according to the IUPAC nomenclature system?"],o:[["SO₃: Sulfur trioksida","SO₃: Sulphur trioxide"],["MgO: Magnesium dioksida","MgO: Magnesium dioxide"],["Fe₂O₃: Ferum(II) oksida","Fe₂O₃: Iron(II) oxide"],["Cu₂O: Kuprum(II) oksida","Cu₂O: Copper(II) oxide"]],a:0,g:["Sebatian kovalen guna awalan (SO₃ = sulfur trioksida). MgO ialah magnesium oksida. Fe₂O₃ ialah ferum(III) oksida (2x = +6, x = +3). Cu₂O ialah kuprum(I) oksida (2x = +2, x = +1).","Covalent compounds use prefixes (SO₃ = sulphur trioxide). MgO is magnesium oxide. Fe₂O₃ is iron(III) oxide (2x = +6, x = +3). Cu₂O is copper(I) oxide (2x = +2, x = +1)."]}
]},
{id:"b1_3",bm:"1.3 Sel kimia",en:"1.3 Chemical cells",qs:[
{s:"Putrajaya 2024 S35",q:["Sel elektrokimia: rod karbon X dalam larutan kalium iodida, rod karbon Y dalam air bromin, dihubungkan dengan asid sulfurik cair dan wayar luar. Antara berikut, yang manakah benar?","Electrochemical cell: carbon rod X in potassium iodide solution, carbon rod Y in bromine water, connected by dilute sulphuric acid and an external wire. Which is true?"],o:[["Asid sulfurik membenarkan elektron melaluinya","The sulphuric acid allows electrons to pass through it"],["Elektron mengalir dari rod karbon Y ke X melalui wayar luar","Electrons flow from carbon rod Y to X through the external wire"],["Molekul bromin membebaskan elektron","The bromine molecule gives out electrons"],["Rod karbon X ialah terminal negatif","Carbon rod X is the negative terminal"]],a:3,g:["Ion iodida dioksidakan di X (2I⁻ → I₂ + 2e⁻), maka X ialah anod/terminal negatif. Elektron mengalir dari X ke Y melalui wayar; elektrolit hanya membenarkan ion bergerak; bromin menerima elektron.","Iodide ions are oxidised at X (2I⁻ → I₂ + 2e⁻), so X is the anode/negative terminal. Electrons flow from X to Y through the wire; the electrolyte only lets ions move; bromine gains electrons."]},
{s:"Sarawak Set02 2024 S9",q:["Sel voltan ringkas: satu elektrod X dan satu elektrod kuprum dalam larutan kuprum(II) sulfat. Bahan manakah sesuai sebagai elektrod X?","Simple voltaic cell: electrode X and a copper electrode in copper(II) sulphate solution. Which material is suitable for electrode X?"],o:[["Kalium","Potassium"],["Karbon","Carbon"],["Kuprum","Copper"],["Zink","Zinc"]],a:3,g:["Elektrod X mesti logam yang lebih elektropositif daripada kuprum supaya menjadi terminal negatif. Zink sesuai; kalium terlalu reaktif (bertindak balas dengan air), karbon dan kuprum tidak menghasilkan beza keupayaan.","Electrode X must be a metal more electropositive than copper so it becomes the negative terminal. Zinc is suitable; potassium is too reactive (reacts with water), carbon and copper give no potential difference."]},
{s:"JUJ Set02 2024 S21",q:["Sel Daniell: elektrod zink dalam larutan zink sulfat dan elektrod kuprum dalam larutan kuprum(II) sulfat, disambungkan oleh X (titian garam/pasu berliang). Fungsi X ialah membenarkan pengaliran","Daniell cell: zinc electrode in zinc sulphate solution and copper electrode in copper(II) sulphate solution, connected by X (salt bridge/porous pot). The function of X is to allow the flow of"],o:[["Ion-ion","Ions"],["Atom-atom","Atoms"],["Proton-proton","Protons"],["Elektron-elektron","Electrons"]],a:0,g:["Titian garam melengkapkan litar dengan membenarkan ion bergerak antara dua larutan, dan mengimbangkan cas. Elektron mengalir melalui wayar, bukan melalui larutan.","The salt bridge completes the circuit by letting ions move between the two solutions and balances charge. Electrons flow through the wire, not the solution."]},
{s:"SBP 2024 S36",q:["Sel I: Al | Al³⁺ || Cu²⁺ | Cu, E° sel = +2.00 V. Sel II: Cu | Cu²⁺ || Ag⁺ | Ag, E° sel = +0.46 V. Diberi E° Cu²⁺/Cu = +0.34 V. Apakah voltan sel Al | Al³⁺ || Ag⁺ | Ag?","Cell I: Al | Al³⁺ || Cu²⁺ | Cu, E°cell = +2.00 V. Cell II: Cu | Cu²⁺ || Ag⁺ | Ag, E°cell = +0.46 V. Given E° Cu²⁺/Cu = +0.34 V. What is the voltage of the cell Al | Al³⁺ || Ag⁺ | Ag?"],o:[["0.86 V","0.86 V"],["1.54 V","1.54 V"],["2.22 V","2.22 V"],["2.46 V","2.46 V"]],a:3,g:["Sel I: 0.34 − E°(Al) = 2.00 → E°(Al) = −1.66 V. Sel II: E°(Ag) − 0.34 = 0.46 → E°(Ag) = +0.80 V. Sel Al/Ag: 0.80 − (−1.66) = +2.46 V.","Cell I: 0.34 − E°(Al) = 2.00 → E°(Al) = −1.66 V. Cell II: E°(Ag) − 0.34 = 0.46 → E°(Ag) = +0.80 V. Al/Ag cell: 0.80 − (−1.66) = +2.46 V."]},
{s:"Johor Batu Pahat 2024 S34",q:["Sel voltan dengan elektrod zink dan kuprum. Diberi Zn²⁺/Zn E° = −0.76 V dan Cu²⁺/Cu E° = +0.34 V. Berapakah voltan sel ini?","Voltaic cell with zinc and copper electrodes. Given Zn²⁺/Zn E° = −0.76 V and Cu²⁺/Cu E° = +0.34 V. What is the voltage of the cell?"],o:[["+1.10 V","+1.10 V"],["−0.42 V","−0.42 V"],["−1.10 V","−1.10 V"],["+0.42 V","+0.42 V"]],a:0,g:["E° sel = E° katod − E° anod = +0.34 − (−0.76) = +1.10 V. Voltan sel sentiasa positif.","E°cell = E°cathode − E°anode = +0.34 − (−0.76) = +1.10 V. Cell voltage is always positive."]},
{s:"Sarawak Set02 2024 S34",q:["MnO₄⁻ + 8H⁺ + 5e⁻ ⇌ Mn²⁺ + 4H₂O, E° = +1.52 V; Fe³⁺ + e⁻ ⇌ Fe²⁺, E° = +0.77 V. Pernyataan manakah betul? I: e.m.f. sel ialah +2.29 V. II: Fe²⁺ agen penurunan lebih kuat daripada Mn²⁺. III: Nombor pengoksidaan Fe berubah +3 ke +2. IV: Elektrod MnO₄⁻/Mn²⁺ ialah katod.","MnO₄⁻ + 8H⁺ + 5e⁻ ⇌ Mn²⁺ + 4H₂O, E° = +1.52 V; Fe³⁺ + e⁻ ⇌ Fe²⁺, E° = +0.77 V. Which statements are true? I: e.m.f. is +2.29 V. II: Fe²⁺ is a stronger reducing agent than Mn²⁺. III: Oxidation number of Fe changes +3 to +2. IV: MnO₄⁻/Mn²⁺ electrode is the cathode."],o:[["I dan II","I and II"],["I dan III","I and III"],["II dan IV","II and IV"],["III dan IV","III and IV"]],a:2,g:["I salah: e.m.f. = 1.52 − 0.77 = +0.75 V. II betul: E° Fe lebih rendah maka Fe²⁺ lebih mudah menderma elektron. III salah: dalam sel ini Fe²⁺ dioksidakan kepada Fe³⁺ (+2 → +3). IV betul: E° lebih positif ialah katod.","I is false: e.m.f. = 1.52 − 0.77 = +0.75 V. II is true: Fe has the lower E° so Fe²⁺ donates electrons more easily. III is false: in this cell Fe²⁺ is oxidised to Fe³⁺ (+2 → +3). IV is true: the more positive E° is the cathode."]},
{s:"Johor 2024 S19",q:["Sel kimia dengan elektrod P dalam larutan ion P²⁺ dan elektrod Q dalam larutan ion Q⁺, dipisahkan pasu berliang. Elektron bergerak dari elektrod P ke elektrod Q melalui wayar. Pernyataan manakah betul?","Chemical cell with electrode P in P²⁺ ion solution and electrode Q in Q⁺ ion solution, separated by a porous pot. Electrons move from electrode P to electrode Q through the wire. Which statement is correct?"],o:[["Elektrod P ialah katod","Electrode P is the cathode"],["Ion Q⁺ ialah agen pengoksidaan","Q⁺ ion is an oxidising agent"],["Ion P²⁺ menerima elektron","P²⁺ ion receives electrons"],["Nombor pengoksidaan P berubah dari +2 kepada 0","Oxidation number of P changes from +2 to 0"]],a:1,g:["Elektron meninggalkan P, maka P ialah anod (pengoksidaan: P → P²⁺ + 2e⁻, 0 → +2). Elektron diterima oleh ion Q⁺ di katod Q, jadi Q⁺ diturunkan dan ialah agen pengoksidaan.","Electrons leave P, so P is the anode (oxidation: P → P²⁺ + 2e⁻, 0 → +2). Electrons are accepted by Q⁺ ions at cathode Q, so Q⁺ is reduced and is the oxidising agent."]},
{s:"Johor Muar 2024 S33",q:["Sel voltan zink (Zn²⁺/Zn E° = −0.76 V) dan kuprum (Cu²⁺/Cu E° = +0.34 V). Berapakah nilai voltan sel ini?","Voltaic cell of zinc (Zn²⁺/Zn E° = −0.76 V) and copper (Cu²⁺/Cu E° = +0.34 V). What is the voltage of the cell?"],o:[["−0.42 V","−0.42 V"],["+0.42 V","+0.42 V"],["−1.10 V","−1.10 V"],["+1.10 V","+1.10 V"]],a:3,g:["E° sel = +0.34 − (−0.76) = +1.10 V. Tolak (bukan campur) nilai E° anod daripada katod.","E°cell = +0.34 − (−0.76) = +1.10 V. Subtract the anode E° from the cathode E°."]},
{s:"Kedah 2024 S34",q:["Sel kimia: jalur plumbum dan jalur kuprum dalam larutan kuprum(II) sulfat disambungkan kepada voltmeter. Bagaimanakah bacaan voltmeter dapat ditingkatkan?","Voltaic cell: lead strip and copper strip in copper(II) sulphate solution connected to a voltmeter. How can the voltmeter reading be increased?"],o:[["Tukar kedudukan elektrod","Interchange the position of the electrodes"],["Gantikan jalur plumbum dengan zink","Replace the lead strip with zinc"],["Tambah lebih banyak air kepada larutan","Add more water to the solution"],["Gantikan larutan kuprum(II) sulfat dengan larutan plumbum(II) nitrat","Replace copper(II) sulphate solution with lead(II) nitrate solution"]],a:1,g:["Voltan meningkat apabila logam anod lebih jauh dalam Siri Keupayaan Elektrod daripada logam katod. Zink lebih elektropositif daripada plumbum, maka beza keupayaan lebih besar.","Voltage rises when the anode metal is further from the cathode metal in the electrochemical series. Zinc is more electropositive than lead, so the potential difference is larger."]},
{s:"Melaka 2024 S37",q:["Sel kimia magnesium dan kuprum dalam larutan kuprum(II) sulfat. Mg²⁺/Mg E° = −2.38 V; Cu²⁺/Cu E° = +0.34 V. Kirakan voltan sel yang terhasil.","Chemical cell of magnesium and copper in copper(II) sulphate solution. Mg²⁺/Mg E° = −2.38 V; Cu²⁺/Cu E° = +0.34 V. Calculate the cell voltage."],o:[["+2.72 V","+2.72 V"],["−2.72 V","−2.72 V"],["−2.04 V","−2.04 V"],["+2.04 V","+2.04 V"]],a:0,g:["E° sel = +0.34 − (−2.38) = +2.72 V.","E°cell = +0.34 − (−2.38) = +2.72 V."]},
{s:"MRSM 2024 S37",q:["Sel kimia: magnesium dalam larutan magnesium sulfat dan argentum dalam larutan argentum nitrat, dipisahkan pasu berliang. Mg²⁺/Mg E° = −2.38 V; Ag⁺/Ag E° = +0.80 V. Manakah menunjukkan persamaan ion keseluruhan dan voltan sel?","Chemical cell: magnesium in magnesium sulphate solution and silver in silver nitrate solution, separated by a porous pot. Mg²⁺/Mg E° = −2.38 V; Ag⁺/Ag E° = +0.80 V. Which shows the overall ionic equation and cell voltage?"],o:[["Mg + Ag⁺ → Mg²⁺ + Ag ; +3.18 V","Mg + Ag⁺ → Mg²⁺ + Ag ; +3.18 V"],["Mg²⁺ + 2Ag → Mg + 2Ag⁺ ; −1.58 V","Mg²⁺ + 2Ag → Mg + 2Ag⁺ ; −1.58 V"],["Mg + 2Ag⁺ → Mg²⁺ + 2Ag ; +3.18 V","Mg + 2Ag⁺ → Mg²⁺ + 2Ag ; +3.18 V"],["Mg + 2Ag⁺ → Mg + 2Ag ; −1.58 V","Mg + 2Ag⁺ → Mg + 2Ag ; −1.58 V"]],a:2,g:["Mg (E° lebih negatif) ialah anod: Mg → Mg²⁺ + 2e⁻. Ag⁺ ialah katod: Ag⁺ + e⁻ → Ag (darab 2 supaya elektron seimbang, tetapi E° tidak didarab). E° sel = +0.80 − (−2.38) = +3.18 V.","Mg (more negative E°) is the anode: Mg → Mg²⁺ + 2e⁻. Ag⁺ is the cathode: Ag⁺ + e⁻ → Ag (multiply by 2 to balance electrons, but E° is not multiplied). E°cell = +0.80 − (−2.38) = +3.18 V."]},
{s:"MRSM 2024 S40",q:["Dua sel kimia dengan kuprum sebagai katod: logam X (E° sel = +2.72 V) dan logam Y (E° sel = +0.42 V). Dalam Set I dan Set II, logam X dan Y dimasukkan ke dalam larutan argentum nitrat dan kedua-dua bekas menjadi panas. Pernyataan manakah menerangkan eksperimen itu dengan tepat?","Two chemical cells with copper as cathode: metal X (E°cell = +2.72 V) and metal Y (E°cell = +0.42 V). In Set I and Set II, metals X and Y are placed in silver nitrate solution and both containers become hot. Which statement best describes the experiments?"],o:[["Haba penyesaran bagi Set II lebih rendah berbanding Set I","Heat of displacement for Set II is lower than Set I"],["Kenaikan suhu bagi Set I lebih rendah berbanding Set II","Temperature rise for Set I is lower than Set II"],["Haba yang terbebas ke persekitaran bagi Set II lebih tinggi berbanding Set I","Heat released to the surroundings for Set II is higher than Set I"],["Jumlah kandungan tenaga hasil tindak balas lebih tinggi daripada bahan tindak balas dalam kedua-dua set","Total energy content of products is higher than reactants in both sets"]],a:0,g:["X mempunyai E° sel lebih besar maka X lebih elektropositif dan menyesarkan argentum dengan lebih mudah, membebaskan lebih banyak haba. Y kurang elektropositif jadi haba penyesaran Set II lebih rendah. Tindak balas eksotermik: tenaga hasil lebih rendah.","X has the larger E°cell so X is more electropositive and displaces silver more readily, releasing more heat. Y is less electropositive so Set II has the lower heat of displacement. The reactions are exothermic: products have lower energy."]},
{s:"Negeri Sembilan 2024 S35",q:["Zn²⁺ + 2e⁻ ⇌ Zn, E° = −0.76 V; Sn²⁺ + 2e⁻ ⇌ Sn, E° = −0.14 V. Notasi sel manakah mewakili tindak balas redoks dalam sel kimia ini?","Zn²⁺ + 2e⁻ ⇌ Zn, E° = −0.76 V; Sn²⁺ + 2e⁻ ⇌ Sn, E° = −0.14 V. Which cell notation represents the redox reaction in this chemical cell?"],o:[["Zn²⁺ | Zn || Sn | Sn²⁺","Zn²⁺ | Zn || Sn | Sn²⁺"],["Zn | Zn²⁺ || Sn²⁺ | Sn","Zn | Zn²⁺ || Sn²⁺ | Sn"],["Sn²⁺ | Sn || Zn | Zn²⁺","Sn²⁺ | Sn || Zn | Zn²⁺"],["Sn | Sn²⁺ || Zn²⁺ | Zn","Sn | Sn²⁺ || Zn²⁺ | Zn"]],a:1,g:["Notasi sel: anod (pengoksidaan) di kiri, katod (penurunan) di kanan. Zn (E° lebih negatif) ialah anod: Zn | Zn²⁺ || Sn²⁺ | Sn. Format logam | ion || ion | logam.","Cell notation: anode (oxidation) on the left, cathode (reduction) on the right. Zn (more negative E°) is the anode: Zn | Zn²⁺ || Sn²⁺ | Sn. Format: metal | ion || ion | metal."]},
{s:"Negeri Sembilan 2024 S9",q:["Mg²⁺ + 2e⁻ ⇌ Mg, E° = −2.38 V; Cu²⁺ + 2e⁻ ⇌ Cu, E° = +0.34 V. Pernyataan manakah betul bagi sel kimia ini?","Mg²⁺ + 2e⁻ ⇌ Mg, E° = −2.38 V; Cu²⁺ + 2e⁻ ⇌ Cu, E° = +0.34 V. Which statement is correct for this chemical cell?"],o:[["Cu ialah terminal positif","Cu is the positive terminal"],["Nilai E° sel ialah −2.72 V","E°cell is −2.72 V"],["Mg²⁺ ialah agen pengoksidaan","Mg²⁺ is an oxidising agent"],["Persamaan ion: Mg²⁺ + Cu → Cu²⁺ + Mg","Ionic equation: Mg²⁺ + Cu → Cu²⁺ + Mg"]],a:0,g:["Cu (E° lebih positif) ialah katod = terminal positif. E° sel = +0.34 − (−2.38) = +2.72 V (positif). Tindak balas sebenar ialah Mg + Cu²⁺ → Mg²⁺ + Cu; Mg²⁺ bukan agen pengoksidaan dalam sel ini.","Cu (more positive E°) is the cathode = positive terminal. E°cell = +0.34 − (−2.38) = +2.72 V (positive). The actual reaction is Mg + Cu²⁺ → Mg²⁺ + Cu; Mg²⁺ is not the oxidising agent in this cell."]},
{s:"Perak 2024 S12",q:["Cu²⁺ + 2e⁻ ⇌ Cu, E° = +0.34 V; Ag⁺ + e⁻ ⇌ Ag, E° = +0.80 V. Antara berikut, yang manakah agen pengoksidaan paling kuat?","Cu²⁺ + 2e⁻ ⇌ Cu, E° = +0.34 V; Ag⁺ + e⁻ ⇌ Ag, E° = +0.80 V. Which is the strongest oxidising agent?"],o:[["Cu²⁺","Cu²⁺"],["Ag⁺","Ag⁺"],["Cu","Cu"],["Ag","Ag"]],a:1,g:["Agen pengoksidaan ialah ion di sebelah kiri persamaan. Nilai E° paling positif (+0.80 V) bermaksud Ag⁺ paling mudah menerima elektron.","Oxidising agents are the ions on the left side of the equation. The most positive E° (+0.80 V) means Ag⁺ accepts electrons most easily."]},
{s:"SPM 2023 S23",q:["E° bagi logam: Z −0.14 V, Y −0.44 V, X −0.76 V, W −2.38 V. Pasangan logam dan terminal manakah dipadankan dengan betul?","E° values of metals: Z −0.14 V, Y −0.44 V, X −0.76 V, W −2.38 V. Which pair of metals and terminals is matched correctly?"],o:[["W dan X: positif W, negatif X","W and X: positive W, negative X"],["X dan Y: positif X, negatif Y","X and Y: positive X, negative Y"],["Y dan Z: positif Y, negatif Z","Y and Z: positive Y, negative Z"],["W dan Z: positif Z, negatif W","W and Z: positive Z, negative W"]],a:3,g:["Logam dengan E° lebih negatif ialah terminal negatif (anod); yang kurang negatif ialah terminal positif (katod). W (−2.38) lebih negatif daripada Z (−0.14), maka W negatif dan Z positif. Dalam A, B dan C terminalnya terbalik.","The metal with the more negative E° is the negative terminal (anode); the less negative is the positive terminal (cathode). W (−2.38) is more negative than Z (−0.14), so W is negative and Z positive. In A, B and C the terminals are reversed."]},
{s:"JUJ Set01 2024 S37",q:["Sel kimia: elektrod kuprum dalam larutan kuprum(II) sulfat dan elektrod argentum dalam larutan argentum nitrat, disambungkan oleh asid sulfurik. Manakah setengah persamaan di anod dan katod?","Chemical cell: copper electrode in copper(II) sulphate solution and silver electrode in silver nitrate solution, connected by sulphuric acid. Which are the half-equations at the anode and cathode?"],o:[["Anod: Cu → Cu²⁺ + 2e⁻ ; Katod: Ag⁺ + e⁻ → Ag","Anode: Cu → Cu²⁺ + 2e⁻ ; Cathode: Ag⁺ + e⁻ → Ag"],["Anod: Cu → Cu²⁺ + 2e⁻ ; Katod: 2H⁺ + 2e⁻ → H₂","Anode: Cu → Cu²⁺ + 2e⁻ ; Cathode: 2H⁺ + 2e⁻ → H₂"],["Anod: Ag → Ag⁺ + e⁻ ; Katod: Cu²⁺ + 2e⁻ → Cu","Anode: Ag → Ag⁺ + e⁻ ; Cathode: Cu²⁺ + 2e⁻ → Cu"],["Anod: Ag → Ag⁺ + e⁻ ; Katod: 2H⁺ + 2e⁻ → H₂","Anode: Ag → Ag⁺ + e⁻ ; Cathode: 2H⁺ + 2e⁻ → H₂"]],a:0,g:["Cu (E° +0.34 V) lebih elektropositif daripada Ag (+0.80 V), jadi Cu ialah anod (dioksidakan) dan Ag⁺ di katod diturunkan menjadi Ag. Asid sulfurik hanya titian ion, ia tidak terlibat dalam tindak balas elektrod.","Cu (E° +0.34 V) is more electropositive than Ag (+0.80 V), so Cu is the anode (oxidised) and Ag⁺ at the cathode is reduced to Ag. Sulphuric acid is only the ion bridge; it does not take part in the electrode reactions."]},
{s:"Sarawak Set02 2024 S26",q:["R⁺ + e⁻ ⇌ R⁻, E° = +0.83 V; S²⁺ + e⁻ ⇌ S⁺, E° = −0.56 V; T³⁺ + e⁻ ⇌ T²⁺, E° = −0.77 V. Antara berikut, yang manakah agen penurunan paling kuat?","R⁺ + e⁻ ⇌ R⁻, E° = +0.83 V; S²⁺ + e⁻ ⇌ S⁺, E° = −0.56 V; T³⁺ + e⁻ ⇌ T²⁺, E° = −0.77 V. Which is the strongest reducing agent?"],o:[["S²⁺","S²⁺"],["R⁺","R⁺"],["R⁻","R⁻"],["T²⁺","T²⁺"]],a:3,g:["Agen penurunan ialah spesies di sebelah kanan persamaan. E° paling negatif (−0.77 V) ialah T³⁺/T²⁺, maka T²⁺ paling mudah menderma elektron.","Reducing agents are the species on the right side of the equation. The most negative E° (−0.77 V) belongs to T³⁺/T²⁺, so T²⁺ donates electrons most easily."]},
{s:"Perlis 2024 S38",q:["Notasi sel: Zn(s) | Zn²⁺(aq) || Cu²⁺(aq) | Cu(s). Jika eksperimen menggunakan 100 cm³ larutan zink nitrat 0.5 mol dm⁻³ dan 100 cm³ larutan kuprum(II) sulfat 0.5 mol dm⁻³, berapakah jisim maksimum pepejal terenap di katod? [Cu = 64, Zn = 65]","Cell notation: Zn(s) | Zn²⁺(aq) || Cu²⁺(aq) | Cu(s). If the experiment uses 100 cm³ of 0.5 mol dm⁻³ zinc nitrate and 100 cm³ of 0.5 mol dm⁻³ copper(II) sulphate, what is the maximum mass of solid deposited at the cathode? [Cu = 64, Zn = 65]"],o:[["2.80 g","2.80 g"],["3.20 g","3.20 g"],["3.25 g","3.25 g"],["3.50 g","3.50 g"]],a:1,g:["Katod ialah Cu: Cu²⁺ + 2e⁻ → Cu. Mol Cu²⁺ = 0.5 × 100/1000 = 0.05 mol, maka maksimum 0.05 mol Cu. Jisim = 0.05 × 64 = 3.20 g. Zink nitrat berada di sebelah anod dan tidak terenap.","The cathode is Cu: Cu²⁺ + 2e⁻ → Cu. Moles of Cu²⁺ = 0.5 × 100/1000 = 0.05 mol, so at most 0.05 mol Cu. Mass = 0.05 × 64 = 3.20 g. The zinc nitrate is on the anode side and does not deposit."]}
]},
{id:"b1_4",bm:"1.4 Sel elektrolisis",en:"1.4 Electrolytic cells",qs:[
{s:"Kedah 2024 S13",q:["Ion yang manakah terdapat dalam leburan plumbum(II) bromida?","Which ions are present in molten lead(II) bromide?"],o:[["Pb²⁺, Br⁻","Pb²⁺, Br⁻"],["Pb²⁺, Br⁻, H⁺","Pb²⁺, Br⁻, H⁺"],["Pb²⁺, Br⁻, OH⁻","Pb²⁺, Br⁻, OH⁻"],["Pb²⁺, Br⁻, H⁺, OH⁻","Pb²⁺, Br⁻, H⁺, OH⁻"]],a:0,g:["Leburan sebatian ion hanya mengandungi ion daripada sebatian itu (Pb²⁺ dan Br⁻). Ion H⁺ dan OH⁻ datang daripada air, yang tiada dalam leburan.","A molten ionic compound contains only its own ions (Pb²⁺ and Br⁻). H⁺ and OH⁻ come from water, which is absent in a melt."]},
{s:"Sarawak Set02 2024 S27",q:["Elektrolisis leburan plumbum(II) bromida menggunakan elektrod karbon. Persamaan setengah yang manakah menunjukkan tindak balas di anod?","Electrolysis of molten lead(II) bromide using carbon electrodes. Which half-equation shows the reaction at the anode?"],o:[["Pb → Pb²⁺ + 2e⁻","Pb → Pb²⁺ + 2e⁻"],["Pb²⁺ + 2e⁻ → Pb","Pb²⁺ + 2e⁻ → Pb"],["Br₂ + 2e⁻ → 2Br⁻","Br₂ + 2e⁻ → 2Br⁻"],["2Br⁻ → Br₂ + 2e⁻","2Br⁻ → Br₂ + 2e⁻"]],a:3,g:["Anod menarik anion. Ion Br⁻ dinyahcas dengan melepaskan elektron (pengoksidaan): 2Br⁻ → Br₂ + 2e⁻. Pb²⁺ + 2e⁻ → Pb berlaku di katod.","The anode attracts anions. Br⁻ ions are discharged by losing electrons (oxidation): 2Br⁻ → Br₂ + 2e⁻. Pb²⁺ + 2e⁻ → Pb occurs at the cathode."]},
{s:"Perak 2024 S27",q:["Elektrolisis leburan plumbum(II) bromida, PbBr₂, dengan elektrod karbon X (disambung ke terminal positif bateri) dan Y (terminal negatif). Apakah hasil pada elektrod X dan Y?","Electrolysis of molten lead(II) bromide, PbBr₂, with carbon electrodes X (connected to the positive terminal of the battery) and Y (negative terminal). What are the products at electrodes X and Y?"],o:[["X: logam plumbum, Y: gas bromin","X: lead metal, Y: bromine gas"],["X: gas hidrogen, Y: gas oksigen","X: hydrogen gas, Y: oxygen gas"],["X: gas hidrogen, Y: gas bromin","X: hydrogen gas, Y: bromine gas"],["X: gas bromin, Y: logam plumbum","X: bromine gas, Y: lead metal"]],a:3,g:["X (terminal positif) ialah anod: 2Br⁻ → Br₂ + 2e⁻, gas bromin. Y (terminal negatif) ialah katod: Pb²⁺ + 2e⁻ → Pb, logam plumbum. Tiada air, maka tiada hidrogen atau oksigen.","X (positive terminal) is the anode: 2Br⁻ → Br₂ + 2e⁻, bromine gas. Y (negative terminal) is the cathode: Pb²⁺ + 2e⁻ → Pb, lead metal. No water, so no hydrogen or oxygen."]},
{s:"Johor Pasir Gudang Set01 2024 S13",q:["Sel elektrolisis dengan elektrod karbon, bateri dan mentol. Mentol menyala apabila suis ditutup. Antara berikut, yang manakah bahan P dalam bikar?","Electrolytic cell with carbon electrodes, a battery and a bulb. The bulb lights up when the switch is closed. Which is substance P in the beaker?"],o:[["Etil etanoat","Ethyl ethanoate"],["Klorometana","Chloromethane"],["Larutan glukosa","Glucose solution"],["Larutan natrium klorida","Sodium chloride solution"]],a:3,g:["Mentol menyala maka P mengalirkan arus, iaitu elektrolit yang mengandungi ion bebas bergerak. Natrium klorida terion dalam air. Etil etanoat, klorometana dan glukosa ialah sebatian kovalen yang tidak mengion.","The bulb lights up so P conducts electricity, i.e. an electrolyte with mobile ions. Sodium chloride ionises in water. Ethyl ethanoate, chloromethane and glucose are covalent compounds that do not form ions."]},
{s:"JUJ Set01 2024 S27",q:["Azli menyadur sudu besi dengan argentum menggunakan elektrod argentum dan larutan kuprum(II) nitrat. Selepas 30 minit sudu belum disadur. Apakah yang patut dilakukan? I: Guna arus lebih tinggi. II: Ganti larutan dengan larutan argentum nitrat. III: Guna larutan kuprum(II) nitrat lebih pekat. IV: Sambung sudu besi ke terminal negatif dan kepingan argentum ke terminal positif.","Azli electroplates an iron spoon with silver using a silver electrode and copper(II) nitrate solution. After 30 minutes the spoon is not plated. What should he do? I: Use a higher current. II: Replace the solution with silver nitrate solution. III: Use a more concentrated copper(II) nitrate solution. IV: Connect the iron spoon to the negative terminal and the silver plate to the positive terminal."],o:[["I dan II","I and II"],["I dan III","I and III"],["III dan IV","III and IV"],["II dan IV","II and IV"]],a:3,g:["Penyaduran argentum memerlukan elektrolit yang mengandungi ion argentum (II) dan objek yang disadur sebagai katod (terminal negatif) serta argentum sebagai anod (terminal positif) (IV). Arus lebih tinggi atau larutan kuprum lebih pekat hanya menyadur kuprum, bukan argentum.","Silver plating needs an electrolyte containing silver ions (II), with the object to be plated as the cathode (negative terminal) and silver as the anode (positive terminal) (IV). A higher current or more concentrated copper solution would only plate copper, not silver."]},
{s:"Sarawak Set01 2024 S33",q:["Sel I (zink dalam zink nitrat dan argentum dalam argentum nitrat) disambung kepada Sel II (karbon X dan karbon Y dalam larutan zink nitrat); karbon X disambung kepada argentum dan karbon Y kepada zink. Diberi Zn²⁺/Zn −0.76 V, 2H⁺/H₂ 0.00 V, Ag⁺/Ag +0.80 V, O₂/OH⁻ +0.40 V. Antara berikut, yang manakah benar?","Cell I (zinc in zinc nitrate and silver in silver nitrate) is connected to Cell II (carbon X and carbon Y in zinc nitrate solution); carbon X is connected to silver and carbon Y to zinc. Given Zn²⁺/Zn −0.76 V, 2H⁺/H₂ 0.00 V, Ag⁺/Ag +0.80 V, O₂/OH⁻ +0.40 V. Which is correct?"],o:[["Zink menebal; argentum menipis; karbon X tiada perubahan; karbon Y gelembung gas tidak berwarna","Zinc becomes thicker; silver becomes thinner; carbon X no change; carbon Y bubbles of colourless gas"],["Zink menipis; argentum menebal; karbon X gelembung gas tidak berwarna; karbon Y tiada perubahan","Zinc becomes thinner; silver becomes thicker; carbon X bubbles of colourless gas; carbon Y no change"],["Ion zink menerima elektron; atom argentum menyingkirkan elektron; ion nitrat dioksidakan; ion zink diturunkan","Zinc ion gains electrons; silver atom donates electrons; nitrate ion is oxidised; zinc ion is reduced"],["Atom zink menyingkirkan elektron; ion argentum menerima elektron; ion hidroksida dioksidakan; ion hidrogen diturunkan","Zinc atom donates electrons; silver ion gains electrons; hydroxide ion is oxidised; hydrogen ion is reduced"]],a:3,g:["Sel I: Zn (E° paling negatif) ialah anod, Zn → Zn²⁺ + 2e⁻ (menipis); Ag⁺ + e⁻ → Ag di katod (menebal). Sel II: karbon X (disambung ke argentum, positif) ialah anod: 4OH⁻ → O₂ + 2H₂O + 4e⁻. Karbon Y ialah katod: 2H⁺ + 2e⁻ → H₂ kerana H⁺ lebih mudah dinyahcas daripada Zn²⁺.","Cell I: Zn (most negative E°) is the anode, Zn → Zn²⁺ + 2e⁻ (thinner); Ag⁺ + e⁻ → Ag at the cathode (thicker). Cell II: carbon X (connected to silver, positive) is the anode: 4OH⁻ → O₂ + 2H₂O + 4e⁻. Carbon Y is the cathode: 2H⁺ + 2e⁻ → H₂ because H⁺ is discharged more easily than Zn²⁺."]},
{s:"Terengganu 2024 S38",q:["Sel magnesium–kuprum membekalkan arus kepada elektrolisis larutan kuprum(II) sulfat dengan elektrod kuprum X dan Y. X disambung kepada magnesium (terminal negatif) dan Y kepada kuprum (terminal positif). Apakah tindak balas di elektrod kuprum X dan pemerhatian di elektrod kuprum Y?","A magnesium–copper cell supplies current to the electrolysis of copper(II) sulphate solution using copper electrodes X and Y. X is connected to magnesium (negative terminal) and Y to copper (positive terminal). What is the reaction at copper electrode X and the observation at copper electrode Y?"],o:[["X: pengoksidaan; Y: menipis","X: oxidation; Y: thinner"],["X: pengoksidaan; Y: menebal","X: oxidation; Y: thicker"],["X: penurunan; Y: menipis","X: reduction; Y: thinner"],["X: penurunan; Y: menebal","X: reduction; Y: thicker"]],a:2,g:["X disambung ke terminal negatif maka ia katod: Cu²⁺ + 2e⁻ → Cu (penurunan). Y disambung ke terminal positif maka ia anod: Cu → Cu²⁺ + 2e⁻, kuprum menipis.","X is connected to the negative terminal so it is the cathode: Cu²⁺ + 2e⁻ → Cu (reduction). Y is connected to the positive terminal so it is the anode: Cu → Cu²⁺ + 2e⁻, so the copper becomes thinner."]}
]},
{id:"b1_5",bm:"1.5 Pengekstrakan logam daripada bijihnya",en:"1.5 Extraction of metals from their ores",qs:[
{s:"SPM 2023 S22",q:["2Fe₂O₃ + 3C → 4Fe + 3CO₂ mewakili pengekstrakan besi daripada bijihnya. Pasangan manakah yang betul?","2Fe₂O₃ + 3C → 4Fe + 3CO₂ represents the extraction of iron from its ore. Which pair is correct?"],o:[["Agen pengoksidaan: Fe₂O₃; agen penurunan: C","Oxidising agent: Fe₂O₃; reducing agent: C"],["Agen pengoksidaan: C; agen penurunan: Fe₂O₃","Oxidising agent: C; reducing agent: Fe₂O₃"],["Agen pengoksidaan: CO₂; agen penurunan: Fe₂O₃","Oxidising agent: CO₂; reducing agent: Fe₂O₃"],["Agen pengoksidaan: Fe₂O₃; agen penurunan: CO₂","Oxidising agent: Fe₂O₃; reducing agent: CO₂"]],a:0,g:["Fe₂O₃ diturunkan (Fe +3 → 0) maka ia agen pengoksidaan. Karbon dioksidakan (C 0 → +4) maka ia agen penurunan. CO₂ ialah hasil, bukan agen.","Fe₂O₃ is reduced (Fe +3 → 0) so it is the oxidising agent. Carbon is oxidised (C 0 → +4) so it is the reducing agent. CO₂ is a product, not an agent."]},
{s:"JUJ Set02 2024 S25",q:["Menyadur kunci besi dengan argentum: kepingan argentum sebagai anod dan kunci besi sebagai katod dalam larutan argentum nitrat. Apakah pemerhatian dalam eksperimen ini?","Electroplating an iron key with silver: silver plate as the anode and iron key as the cathode in silver nitrate solution. What is the observation?"],o:[["Kepingan argentum menipis","The silver plate becomes thinner"],["Kepingan argentum menebal","The silver plate becomes thicker"],["Pepejal perang terenap pada kunci besi","Brown solid is deposited on the iron key"],["Keamatan warna biru larutan tidak berubah","The intensity of the blue colour of the solution remains unchanged"]],a:0,g:["Di anod argentum mengion: Ag → Ag⁺ + e⁻, maka kepingan argentum menipis. Di katod Ag⁺ + e⁻ → Ag, pepejal kelabu berkilat (bukan perang) terenap pada kunci.","At the anode silver ionises: Ag → Ag⁺ + e⁻, so the silver plate becomes thinner. At the cathode Ag⁺ + e⁻ → Ag, a shiny grey (not brown) solid is deposited on the key."]},
{s:"MRSM 2024 S38",q:["25.0 cm³ larutan kuprum(II) sulfat dielektrolisiskan dengan elektrod karbon (katod berjisim asal 4.0 g, anod 4.5 g) sehingga larutan menjadi tanpa warna. Jisim akhir katod ialah 5.6 g. Apakah kemolaran larutan kuprum(II) sulfat? [Cu = 64]","25.0 cm³ of copper(II) sulphate solution is electrolysed with carbon electrodes (cathode original mass 4.0 g, anode 4.5 g) until the solution is colourless. The final mass of the cathode is 5.6 g. What is the molarity of the copper(II) sulphate solution? [Cu = 64]"],o:[["0.7 mol dm⁻³","0.7 mol dm⁻³"],["1.0 mol dm⁻³","1.0 mol dm⁻³"],["2.5 mol dm⁻³","2.5 mol dm⁻³"],["3.5 mol dm⁻³","3.5 mol dm⁻³"]],a:1,g:["Jisim Cu terenap = 5.6 − 4.0 = 1.6 g. Mol Cu = 1.6/64 = 0.025 mol = mol CuSO₄. Kemolaran = 0.025 / 0.025 dm³ = 1.0 mol dm⁻³.","Mass of Cu deposited = 5.6 − 4.0 = 1.6 g. Moles Cu = 1.6/64 = 0.025 mol = moles CuSO₄. Molarity = 0.025 / 0.025 dm³ = 1.0 mol dm⁻³."]},
{s:"Melaka 2024 S30",q:["Elektrolisis larutan kuprum(II) sulfat: jisim kuprum bertambah daripada 6.0 g kepada 8.5 g pada sudu besi (katod) selepas 30 minit. Berapakah bilangan atom kuprum yang terhasil pada sudu besi? [Cu = 64; pemalar Avogadro = 6.02 × 10²³ mol⁻¹]","Electrolysis of copper(II) sulphate solution: the copper on the iron spoon (cathode) increases from 6.0 g to 8.5 g after 30 minutes. What is the number of copper atoms produced on the iron spoon? [Cu = 64; Avogadro constant = 6.02 × 10²³ mol⁻¹]"],o:[["2.35 × 10²²","2.35 × 10²²"],["5.64 × 10²²","5.64 × 10²²"],["7.99 × 10²²","7.99 × 10²²"],["1.36 × 10²³","1.36 × 10²³"]],a:0,g:["Jisim Cu terenap = 8.5 − 6.0 = 2.5 g. Mol = 2.5/64 = 0.0391 mol. Bilangan atom = 0.0391 × 6.02 × 10²³ = 2.35 × 10²².","Mass of Cu deposited = 8.5 − 6.0 = 2.5 g. Moles = 2.5/64 = 0.0391 mol. Number of atoms = 0.0391 × 6.02 × 10²³ = 2.35 × 10²²."]}
]},
{id:"b1_6",bm:"1.6 Pengaratan",en:"1.6 Rusting",qs:[
{s:"Terengganu 2024 S30",q:["Setitis air di atas sebatang besi. Persamaan manakah berlaku di anod?","A water droplet on an iron rod. Which equation occurs at the anode?"],o:[["Fe → Fe²⁺ + 2e⁻","Fe → Fe²⁺ + 2e⁻"],["O₂ + 2H₂O + 4e⁻ → 4OH⁻","O₂ + 2H₂O + 4e⁻ → 4OH⁻"],["Fe²⁺ + 2OH⁻ → Fe(OH)₂","Fe²⁺ + 2OH⁻ → Fe(OH)₂"],["4Fe + 3O₂ + 2xH₂O → 2Fe₂O₃·xH₂O","4Fe + 3O₂ + 2xH₂O → 2Fe₂O₃·xH₂O"]],a:0,g:["Di anod (bahagian tengah titisan, kurang oksigen) besi dioksidakan: Fe → Fe²⁺ + 2e⁻. O₂ + 2H₂O + 4e⁻ → 4OH⁻ berlaku di katod.","At the anode (centre of the droplet, less oxygen) iron is oxidised: Fe → Fe²⁺ + 2e⁻. O₂ + 2H₂O + 4e⁻ → 4OH⁻ occurs at the cathode."]},
{s:"Sarawak Set01 2024 S21",q:["Mekanisme pengaratan besi dengan titisan air dan oksigen. Pasangan setengah persamaan manakah mewakili tindak balas di anod dan katod?","Mechanism of iron rusting with a water droplet and oxygen. Which pair of half-equations represents the reactions at the anode and cathode?"],o:[["Anod: O₂ + 2H₂O + 4e⁻ → 4OH⁻ ; Katod: Fe → Fe²⁺ + 2e⁻","Anode: O₂ + 2H₂O + 4e⁻ → 4OH⁻ ; Cathode: Fe → Fe²⁺ + 2e⁻"],["Anod: Fe → Fe²⁺ + 2e⁻ ; Katod: O₂ + 2H₂O + 4e⁻ → 4OH⁻","Anode: Fe → Fe²⁺ + 2e⁻ ; Cathode: O₂ + 2H₂O + 4e⁻ → 4OH⁻"],["Anod: O₂ + 2H₂O + 4e⁻ → 4OH⁻ ; Katod: Fe²⁺ + 2OH⁻ → Fe(OH)₂","Anode: O₂ + 2H₂O + 4e⁻ → 4OH⁻ ; Cathode: Fe²⁺ + 2OH⁻ → Fe(OH)₂"],["Anod: Fe → Fe²⁺ + 2e⁻ ; Katod: Fe(OH)₂ → Fe₂O₃·H₂O","Anode: Fe → Fe²⁺ + 2e⁻ ; Cathode: Fe(OH)₂ → Fe₂O₃·H₂O"]],a:1,g:["Pengoksidaan (pelepasan elektron) selalu di anod: Fe → Fe²⁺ + 2e⁻. Penurunan (penerimaan elektron) di katod: oksigen + air + elektron → ion hidroksida. Pilihan A terbalik; C dan D bukan setengah persamaan elektrod.","Oxidation (loss of electrons) is always at the anode: Fe → Fe²⁺ + 2e⁻. Reduction (gain of electrons) is at the cathode: oxygen + water + electrons → hydroxide ions. A is reversed; C and D are not electrode half-equations."]},
{s:"Putrajaya 2024 S24",q:["Antara logam berikut, manakah yang dapat mencegah pengaratan apabila bersentuh dengan besi?","Which of the following metals can prevent rusting when in contact with iron?"],o:[["Plumbum","Lead"],["Argentum","Silver"],["Kuprum","Copper"],["Aluminium","Aluminium"]],a:3,g:["Logam yang lebih elektropositif daripada besi (aluminium, zink, magnesium) menjadi anod dan terkakis dahulu, sekali gus melindungi besi (perlindungan korban). Plumbum, argentum dan kuprum kurang elektropositif, jadi besi berkarat lebih cepat.","A metal more electropositive than iron (aluminium, zinc, magnesium) becomes the anode and corrodes first, protecting the iron (sacrificial protection). Lead, silver and copper are less electropositive, so iron rusts faster."]},
{s:"JUJ Set02 2024 S7",q:["Antara berikut, yang manakah BUKAN cara pencegahan pengaratan besi?","Which of the following is NOT a way to prevent iron corrosion?"],o:[["Pengaloian","Alloying"],["Perlindungan logam korban","Sacrificial metal protection"],["Penggunaan permukaan perlindungan","Use of protective surfaces"],["Mengikis permukaan menggunakan kertas pasir","Scraping the surface with sandpaper"]],a:3,g:["Mengikis dengan kertas pasir hanya menanggalkan karat dan mendedahkan besi segar kepada air dan oksigen, jadi tidak mencegah pengaratan. Pengaloian, logam korban dan salutan pelindung mencegahnya.","Scraping with sandpaper only removes rust and exposes fresh iron to water and oxygen, so it does not prevent rusting. Alloying, sacrificial metals and protective coatings do prevent it."]},
{s:"Kelantan 2024 S35",q:["Paku besi dililit logam Q (Set I) dan logam R (Set II) dalam agar-agar + kalium heksasianoferat(III) + fenolftalein. Set I ada tompok biru; Set II ada tompok merah jambu. Apakah logam Q dan R?","Iron nails coiled with metal Q (Set I) and metal R (Set II) in agar + potassium hexacyanoferrate(III) + phenolphthalein. Set I shows a blue spot; Set II shows a pink spot. What are metals Q and R?"],o:[["Q: kuprum, R: argentum","Q: copper, R: silver"],["Q: argentum, R: zink","Q: silver, R: zinc"],["Q: zink, R: kuprum","Q: zinc, R: copper"],["Q: magnesium, R: zink","Q: magnesium, R: zinc"]],a:1,g:["Tompok biru = ion Fe²⁺ terbentuk, besi berkarat, maka Q kurang elektropositif daripada besi (kuprum/argentum). Tompok merah jambu = ion OH⁻, besi menjadi katod dan dilindungi, maka R lebih elektropositif daripada besi (zink/magnesium). Hanya B memenuhi kedua-duanya.","Blue spot = Fe²⁺ ions formed, the iron is rusting, so Q is less electropositive than iron (copper/silver). Pink spot = OH⁻ ions, iron acts as the cathode and is protected, so R is more electropositive than iron (zinc/magnesium). Only B satisfies both."]},
{s:"Perak 2024 S36",q:["Ujian pengaratan besi dengan logam S (Set I, tompok biru) dan logam T (Set II, tompok merah jambu). Pernyataan manakah betul?","Rusting test of iron with metal S (Set I, blue spot) and metal T (Set II, pink spot). Which statement is correct?"],o:[["Tompok biru menunjukkan kehadiran ion OH⁻","The blue spot shows the presence of OH⁻ ions"],["Ion Fe²⁺ hadir dalam Set I tetapi tiada dalam Set II","Fe²⁺ ions are present in Set I but not in Set II"],["Logam S ialah kuprum manakala logam T ialah magnesium","Metal S is copper while metal T is magnesium"],["Paku besi tidak berkarat dalam Set I tetapi berkarat dalam Set II","The iron nail does not rust in Set I but rusts in Set II"]],a:1,g:["Tompok biru (kalium heksasianoferat(III)) menunjukkan ion Fe²⁺, bukan OH⁻ (itu merah jambu dengan fenolftalein). Set I ada Fe²⁺ (besi berkarat); Set II hanya ada OH⁻ (besi dilindungi). Jadi D songsang, dan identiti logam S dan T tidak dapat dipastikan hanya daripada keputusan ini.","The blue spot (potassium hexacyanoferrate(III)) shows Fe²⁺ ions, not OH⁻ (that is pink with phenolphthalein). Set I has Fe²⁺ (iron rusts); Set II only has OH⁻ (iron protected). So D is reversed, and the identities of S and T cannot be fixed from this result alone."]},
{s:"Pahang 2024 S23",q:["Paku besi dililit kuprum (I), zink (II) dan plumbum (III) dalam agar-agar panas + fenolftalein + kalium heksasianoferat(III). Dalam tabung uji manakah tompok biru dapat diperhatikan?","Iron nails coiled with copper (I), zinc (II) and lead (III) in hot gelatin + phenolphthalein + potassium hexacyanoferrate(III). In which test tubes can the blue spot be observed?"],o:[["I dan II","I and II"],["I dan III","I and III"],["II dan III","II and III"]],a:1,g:["Tompok biru menunjukkan ion Fe²⁺, iaitu besi berkarat. Besi berkarat apabila bersentuh dengan logam yang kurang elektropositif daripada besi: kuprum (I) dan plumbum (III). Zink (II) lebih elektropositif, maka melindungi besi dan hanya tompok merah jambu (OH⁻) kelihatan.","The blue spot shows Fe²⁺ ions, i.e. the iron is rusting. Iron rusts when in contact with a metal less electropositive than iron: copper (I) and lead (III). Zinc (II) is more electropositive, so it protects the iron and only a pink spot (OH⁻) appears."]}
]}]},

const L=["A","B","C","D"];
let lang="bi",sub=null,i=0,score=0,picked=null,wrong=[],name="",db=null,uid=null,isT=false,view="home",shuf=[];
try{name=localStorage.getItem("cq_name")||"";lang=localStorage.getItem("cq_lang")||"bi"}catch(e){}
const $=s=>document.getElementById(s),app=$("app");
const t=(p,k)=>lang==="en"?p[1]:lang==="bm"?p[0]:p[0]+"\n"+p[1];
const E=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const tx=p=>E(t(p)).replace(/\n/g,"<br><span class='mu'>")+(lang==="bi"?"</span>":"");
const lt=o=>lang==="en"?o.en:lang==="bm"?o.bm:o.bm+" / "+o.en;
function bar(){return `<div class="row" style="justify-content:space-between"><h1>⚗️ ChemQuest SPM</h1><div class="row"><button data-a="setL" data-v="bm">BM</button><button data-a="setL" data-v="en">EN</button><button data-a="setL" data-v="bi">BM+EN</button></div></div><div class="mu">Kimia Tingkatan 5 KSSM · Ulang kaji SPM 2026</div>`}
function setL(l){lang=l;try{localStorage.setItem("cq_lang",l)}catch(e){}render()}
function home(){view="home";let h=bar()+`<div class="card"><label class="mu">Nama murid / Student name</label><input id="nm" value="${E(name)}" placeholder="cth: Ali bin Abu 5 Sains 1"><div id="msg" style="color:var(--no);font-size:14px;margin-top:6px"></div></div>`;
TOPICS.forEach(T=>{h+=`<div class="card"><h2>${E(lt(T))}</h2>`;if(!T.subs.length)h+=`<div class="mu">Soalan akan ditambah / Questions coming soon</div>`;T.subs.forEach(S=>h+=`<button class="opt p" data-a="start" data-v="${S.id}">${E(lt(S))} · ${S.qs.length} soalan/qs</button>`);h+="</div>"});
h+=`<div class="card" id="tp" style="display:none"><button data-a="teacher">📊 Panel Cikgu / Teacher dashboard</button></div>`;app.innerHTML=h;if(isT)$("tp").style.display="block"}
function start(id){const nm=$("nm");if(nm&&typeof nm.value==="string"&&nm.value)name=nm.value;if(!name.trim()){const m=$("msg");if(m)m.textContent="Sila isi nama dahulu / Please enter your name first";return}try{localStorage.setItem("cq_name",name)}catch(e){}
TOPICS.forEach(T=>T.subs.forEach(S=>{if(S.id===id)sub=S}));i=0;score=0;wrong=[];picked=null;view="quiz";render()}
function quiz(){const q=sub.qs[i];let h=bar()+`<div class="card"><div class="mu">${E(lt(sub))} · ${i+1}/${sub.qs.length}</div><p><b>${tx(q.q)}</b></p><div class="src">[${E(q.s)}]</div>`;
q.o.forEach((o,k)=>{let c="opt";if(picked!==null){if(k===q.a)c+=" ok";else if(k===picked)c+=" no"}h+=`<button class="${c}" ${picked!==null?"disabled":""} data-a="pick" data-v="${k}"><b>${L[k]}.</b> ${tx(o)}</button>`});
if(picked!==null){const r=picked===q.a;h+=`<div class="guide"><b>${r?"✅ Betul / Correct!":"❌ Salah / Wrong. Jawapan betul / Correct answer: "+L[q.a]}</b><br>${tx(q.g)}</div><p><button class="p" data-a="next">${i+1<sub.qs.length?"Seterusnya / Next ➜":"Lihat keputusan / See results"}</button></p>`}
app.innerHTML=h+"</div>"}
function pick(k){picked=k;const q=sub.qs[i];if(k===q.a)score++;else wrong.push(i);quiz()}
function next(){picked=null;i++;if(i<sub.qs.length)quiz();else done()}
async function done(){view="done";let h=bar()+`<div class="card"><h2>Keputusan / Results</h2><p style="font-size:28px;margin:6px 0"><b>${score} / ${sub.qs.length}</b></p><div class="mu">${E(name)} · ${E(lt(sub))}</div><p id="sv" class="mu"></p>`;
if(wrong.length){h+=`<p><b>Semak semula / Review:</b></p>`;wrong.forEach(w=>{const q=sub.qs[w];h+=`<div class="guide">${tx(q.q)}<br><b>${L[q.a]}.</b> ${tx(q.o[q.a])}<br>${tx(q.g)}</div>`})}else h+=`<p>🎉 Semua betul! / All correct!</p>`;
h+=`<p class="row"><button class="p" data-a="start" data-v="${sub.id}">Cuba lagi / Retry</button><button data-a="home">Menu</button></p></div>`;app.innerHTML=h;

async function teacher(){view="t";app.innerHTML=bar()+`<div class="card">Memuatkan… / Loading…</div>`;
